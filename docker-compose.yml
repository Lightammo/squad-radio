services:
  squad-radio:
    build: .
    container_name: squad-radio
    restart: unless-stopped
    # 从 .env 文件读取 KOOK_TOKEN 等配置；.env 已被 git/docker 忽略
    env_file:
      - .env
    environment:
      SQUAD_RADIO_HEALTH_PORT: 8080
      # SQUAD_RADIO_LOG_CONSOLE: "off"
      # SQUAD_RADIO_MAX_LOG_MB: "50"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
